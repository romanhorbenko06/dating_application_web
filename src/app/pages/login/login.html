<app-auth-layout heading="Вхід в акаунт" subheading="Раді бачити вас знову">
  @if (sessionExpired) {
    <p class="banner banner-warn"><span class="banner-icon">⏱</span> Сесія завершилася. Увійдіть ще раз.</p>
  }

  @if (error()) {
    <p class="banner banner-error"><span class="banner-icon">✕</span> {{ error() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>Електронна пошта</span>
      <input type="email" formControlName="email" autocomplete="email" placeholder="email@example.com" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">Введіть коректну адресу пошти</small>
      }
    </label>

    <label class="field">
      <span>Пароль</span>
      <input type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
    </label>

    <button type="submit" class="btn btn-block" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Входимо…' : 'Увійти' }}
    </button>
  </form>

  <p class="switch">Немає акаунта? <a routerLink="/register">Зареєструватись</a></p>
</app-auth-layout>
